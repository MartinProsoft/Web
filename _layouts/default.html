<!DOCTYPE html>
<html lang="{{ site.lang | default: 'sk' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <section class="page-header">
    <h1 class="project-name">{{ site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
    <a href="{{ '/' | relative_url }}" class="btn">Domov</a>
    <a href="{{ '/o-projekte/' | relative_url }}" class="btn">O projekte</a>
    <a href="{{ '/listok/' | relative_url }}" class="btn">Vlakový lístok</a>
  </section>
  <section class="main-content">
    {{ content }}
    <footer class="site-footer">&copy; 2026 Web</footer>
  </section>
  {% if page.url == '/' %}
  <script src="{{ '/script.js' | relative_url }}"></script>
  {% endif %}
  {% if page.url == '/listok/' %}
  <script src="{{ '/listok.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
